apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "colvenna-catalog.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn" .Values.serviceAccount.roleArn | quote }}
# IRSA injects its own projected token; the server never calls the Kubernetes API.
automountServiceAccountToken: false
