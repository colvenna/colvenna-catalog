# The load tool's logging (tests/performance/README.md). The Paimon client's request log, one line per
# attempt ("[rest] requestId:<id> method:<m> url:<u> duration:<ms>ms", LoggingInterceptor in
# paimon-api 2.0.0), goes to $PERF_OUT/rest.log with the wall-clock time in epoch milliseconds and the
# thread that made it, so that the harness can join it to the load tool's records; everything else,
# warnings and errors only, to the console.
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSSX} %-5p %c{1} - %m%n
appender.rest.type = File
appender.rest.name = rest
appender.rest.fileName = ${env:PERF_OUT:-/work/out}/rest.log
appender.rest.immediateFlush = true
appender.rest.layout.type = PatternLayout
appender.rest.layout.pattern = %d{UNIX_MILLIS} %t %m%n
logger.rest.name = org.apache.paimon.rest.interceptor.LoggingInterceptor
logger.rest.level = INFO
logger.rest.additivity = false
logger.rest.appenderRef.rest.ref = rest
logger.hadoop.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoop.level = ERROR
logger.paimonHadoop.name = org.apache.paimon.utils.HadoopUtils
logger.paimonHadoop.level = ERROR
