# The engines' log in a cell's raw output: warnings and errors only, so that it stays readable.
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSSX} %-5p %c{1} - %m%n
# Flink's local cluster warns about what a local cluster lacks (Hadoop configuration, delegation
# tokens, log files, checkpointing of batch jobs) and about collecting results after a job ended.
logger.noise1.name = org.apache.flink.runtime
logger.noise1.level = ERROR
logger.noise2.name = org.apache.flink.streaming.api.operators.collect
logger.noise2.level = ERROR
logger.noise3.name = org.apache.flink.runtime.util.HadoopUtils
logger.noise3.level = ERROR
logger.noise4.name = org.apache.flink.runtime.metrics
logger.noise4.level = ERROR
logger.noise5.name = org.apache.hadoop.util.NativeCodeLoader
logger.noise5.level = ERROR
logger.noise6.name = org.apache.paimon.utils.HadoopUtils
logger.noise6.level = ERROR
