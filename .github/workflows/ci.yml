# The jobs here and in scripts/ci-local.sh, which runs them on a local host, are the same;
# change both together.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit==4.6.0
      # The ggshield hook scans staged changes, which CI has none of: the ggshield workflow (ggshield.yml)
      # scans the commits instead (#113).
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ggshield
      # The check that the old name stays gone (#31), which pre-commit runs as the old-name hook.
      - run: python3 -m unittest discover -s scripts/rename -p 'test_*.py'
      # The check that no deployment value is in the repository (#99), the deployment-values hook.
      - run: python3 -m unittest discover -s scripts/redaction -p 'test_*.py'

  # Every tracked shell script; ubuntu-latest ships shellcheck.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -x

  # The CDK project (deploy/aws): types and tests, the chart's tests among them (Helm from
  # scripts/install-tools.sh), every stack synthesized (cdk-nag and the guard gating it), and helm lint.
  aws-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/aws/package-lock.json
      - run: scripts/aws-test.sh

  # The deployment scripts' logic (tests/deploy): configuration, preflight decisions, chart arguments,
  # the Helm recovery, the entry points' arguments and the release install, with stub commands where
  # AWS or Kubernetes would be; the release manifest's schema and validation, the third-party record
  # (THIRD_PARTY_NOTICES.md against the tree) and the links (scripts/release); and the security scans'
  # own helpers (scripts/security): the Paimon listing, the ASH settings' checks, and the publication scan
  # and the ggshield hooks (#113).
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The chart arguments' tests render the chart with the pinned Helm.
      - run: scripts/install-tools.sh
      - run: python3 -m unittest discover -s tests/deploy
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/security -p 'test_*.py'

  # The server: compile with Error Prone, spotless check, unit tests and the upstream Paimon
  # contract tests (Testcontainers PostgreSQL); then the serverless live test's driver
  # (tests/serverless/driver), under the same gates (the pom's serverless-driver profile).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml
      - run: mvn -B clean verify
      - run: mvn -B -P serverless-driver clean verify

  # The compatibility matrix offline (tests/compat): cells.json and declared.tsv checked, the
  # runner's tests, and the engine flows built and tested (Error Prone, spotless, JUnit).
  compat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tests/compat/flows/**/pom.xml
      - run: python3 tests/compat/matrix.py check
      - run: python3 -m unittest discover -s tests/compat -p 'test_*.py'
      - run: mvn -B -f tests/compat/flows/pom.xml clean verify

  # The UAT harness offline (tests/uat): its cases held to docs/uat/cases.md, its tests, and its
  # engine flows and Paimon tools built (Error Prone, spotless, JUnit).
  uat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            tests/uat/flows/**/pom.xml
            tests/uat/paimon/pom.xml
      - run: python3 tests/uat/uat.py check
      - run: python3 -m unittest discover -s tests/uat -p 'test_*.py'
      - run: mvn -B -f tests/uat/flows/pom.xml clean verify
      - run: mvn -B -f tests/uat/paimon/pom.xml clean verify

  # The performance harness offline (tests/performance): its targets held to
  # docs/performance/terms.md, its tests, and its load tool built (Error Prone, spotless, JUnit).
  perf-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tests/performance/load/pom.xml
      - run: python3 tests/performance/perf.py check
      - run: python3 -m unittest discover -s tests/performance -p 'test_*.py'
      - run: mvn -B -f tests/performance/load/pom.xml clean verify
